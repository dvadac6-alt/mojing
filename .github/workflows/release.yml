name: Release

# tag 触发（v*）：构建 Windows 安装包并发布到 GitHub Releases，
# electron-updater 据此向已安装用户推送自动更新（需仓库 secrets.GH_TOKEN）。
on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend deps (PyInstaller needs them for the frozen build)
        run: pip install -r backend/requirements.txt pyinstaller
      - name: Install frontend deps
        run: npm ci
      - name: Build & publish installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
